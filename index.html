let lang = (new URLSearchParams(location.search).get('lang')) || (()=>{try{return localStorage.getItem('lang')}catch(e){}})() || 'ar';
if (!i18n[lang]) lang = 'ar';
let activeCat = 'all', query = '', currency = 'SAR', waCtx = 'home', curTab = 'vb';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const t = k => i18n[lang][k] !== undefined ? i18n[lang][k] : k;
const D = a => lang === 'ar' ? a[1] : a[0];             // [en, ar] pair
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const waLink = text => `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(text)}`;
const waCtxMsg = () => (i18n[lang].wa_ctx[waCtx]) || t('wa_default');

  $('#courseGrid').innerHTML = courses.map(c => `
    <article class="card bg-white rounded-2xl border border-brand-100 overflow-hidden flex flex-col">
      ${c.youtubeId
        ? `<div class="aspect-video"><iframe class="w-full h-full" loading="lazy" src="https://www.youtube.com/embed/${esc(c.youtubeId)}" title="${esc(c['title_'+lang])}" allowfullscreen></iframe></div>`
        : `<div class="aspect-video bg-brand-100 flex items-center justify-center text-brand-700 font-semibold"><i class="fa-brands fa-youtube me-2"></i>${t('watch_soon')}</div>`}
      <div class="p-5 flex-1 flex flex-col">
        <h3 class="font-bold text-lg text-brand-900">${esc(c['title_'+lang])}</h3>
        <p class="mt-2 text-sm text-slate-600 flex-1">${esc(c['desc_'+lang])}</p>
        <div class="mt-4 flex flex-wrap gap-2">
          ${c.pdf ? `<a href="${esc(c.pdf)}" download class="btn btn-p !py-2 text-sm"><i class="fa-solid fa-file-pdf me-1"></i>${t('pdf')}</a>`
                  : `<span class="px-3 py-2 rounded-lg bg-slate-100 text-slate-400 text-sm"><i class="fa-solid fa-file-pdf me-1"></i>${t('pdf_soon')}</span>`}
          <a target="_blank" rel="noopener" href="${waLink(c['title_'+lang] + ' - ' + location.href)}" class="btn btn-o !py-2 text-sm !border-green-600 !text-green-700">${t('share')}</a>
        </div>
      </div>
    </article>`).join('');
}
function renderCats(){
  $('#catBar').innerHTML = categories.map(c => `<button data-cat="${c.key}" class="px-3 py-2 rounded-full text-sm font-semibold border ${c.key===activeCat?'tab-on':'bg-white text-slate-600 border-slate-300'}">${esc(c[lang])}</button>`).join('');
  $$('[data-cat]').forEach(b => b.onclick = () => { activeCat = b.dataset.cat; renderCats(); renderArticles(); });
}
function renderArticles(){
  const q = query.trim().toLowerCase();
  const list = articles.filter(a => (activeCat==='all' || a.cat===activeCat) && (!q || (a['title_'+lang]+' '+a['desc_'+lang]+' '+a['body_'+lang]).toLowerCase().includes(q)));
  $('#noResults').classList.toggle('hidden', list.length>0);
  $('#articleGrid').innerHTML = list.map(a => {
    const cat = categories.find(c=>c.key===a.cat);
    return `<article class="card bg-brand-50/60 rounded-2xl border border-brand-100 p-5 flex flex-col">
      <span class="text-xs font-bold text-brand-600">${esc(cat ? cat[lang] : '')}</span>
      <h3 class="mt-1 font-bold text-lg text-brand-900">${esc(a['title_'+lang])}</h3>
      <p class="mt-2 text-sm text-slate-600 flex-1">${esc(a['desc_'+lang])}</p>
      <div class="mt-4 flex gap-2 flex-wrap">
        <button data-article="${a.id}" class="btn btn-p !py-2 text-sm">${t('read_more')}</button>
        <a target="_blank" rel="noopener" href="${waLink(a['title_'+lang] + ' - ' + location.href)}" class="btn btn-o !py-2 text-sm !border-green-600 !text-green-700">${t('share')}</a>
      </div></article>`;
  }).join('');
  $$('[data-article]').forEach(b => b.onclick = () => openArticle(+b.dataset.article));
}
function renderGallery(){
  $('#galleryGrid').innerHTML = gallery.map(g => `
    <figure class="card bg-white rounded-2xl border border-brand-100 overflow-hidden cursor-pointer" data-img="${g.id}">
      <div class="aspect-square bg-gradient-to-br from-brand-100 to-orange-50 flex items-center justify-center overflow-hidden">
        ${g.src ? `<img src="${esc(g.src)}" alt="${esc(g['title_'+lang])}" loading="lazy" class="w-full h-full object-cover">` : `<i class="fa-solid ${g.icon||'fa-image'} text-5xl text-brand-600"></i>`}
      </div>
      <figcaption class="p-3 text-sm font-semibold text-center">${esc(g['title_'+lang])}</figcaption>
    </figure>`).join('');
  $$('[data-img]').forEach(f => f.onclick = () => openImage(+f.dataset.img));
}
function showModal(html){ $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden'); $('#modal').classList.add('flex'); }
function closeModal(){ $('#modal').classList.add('hidden'); $('#modal').classList.remove('flex'); }
function openArticle(id){
  const a = articles.find(x=>x.id===id); if(!a) return;
  showModal(`<h3 class="text-2xl font-extrabold text-brand-900 pe-8">${esc(a['title_'+lang])}</h3><p class="text-xs text-slate-400 mt-1">${esc(a.date)}</p>
    <p class="mt-4 leading-8 text-slate-700">${esc(a['body_'+lang])}</p>
    <a target="_blank" rel="noopener" href="${waLink(a['title_'+lang] + ' - ' + location.href)}" class="btn btn-g mt-5"><i class="fa-brands fa-whatsapp me-1"></i>${t('share')}</a>`);
}
function openImage(id){
  const g = gallery.find(x=>x.id===id); if(!g) return;
  showModal(`<div class="pe-6">${g.src ? `<img src="${esc(g.src)}" alt="" class="w-full rounded-xl">` : `<div class="aspect-video rounded-xl bg-gradient-to-br from-brand-100 to-orange-50 flex items-center justify-center"><i class="fa-solid ${g.icon||'fa-image'} text-8xl text-brand-600"></i></div>`}
    <p class="mt-3 font-bold text-lg">${esc(g['title_'+lang])}</p>
    ${g.src ? `<a href="${esc(g.src)}" download class="btn btn-p mt-3"><i class="fa-solid fa-download me-1"></i>${t('download')}</a>` : ''}</div>`);
}

/* ---------- Toolkit: printable/downloadable data sheets (generated locally) ---------- */
function sheetHTML(kind){
  const ar = lang==='ar', dir = ar?'rtl':'ltr';
  const css = `body{font-family:${ar?'Cairo,':'Inter,'}Arial,sans-serif;margin:24px;direction:${dir}}h1{font-size:20px;color:#1b6b62}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:8px;font-size:12px}th{background:#eaf6f4}.star{display:inline-block;width:46px;height:46px;border:2px solid #21867a;border-radius:50%;margin:4px}@media print{button{display:none}}`;
  const hdr = `<p>${ar?'اسم الطفل':'Child'}: ________________ &nbsp; ${ar?'الملاحظ':'Observer'}: ________________ &nbsp; ${ar?'السلوك المستهدف':'Target behavior'}: ________________</p>`;
  let title='', body='';
  if (kind==='abc'){
    title = ar?'استمارة ABC لجمع البيانات':'ABC Data Sheet';
    const heads = ar?['التاريخ/الوقت','المكان','المسبّب (A)','السلوك (B)','النتيجة (C)','الوظيفة المتوقعة']:['Date/Time','Setting','Antecedent (A)','Behavior (B)','Consequence (C)','Suspected function'];
    body = hdr+`<table><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${('<tr>'+'<td>&nbsp;<br>&nbsp;</td>'.repeat(6)+'</tr>').repeat(12)}</table>`;
  } else if (kind==='freq'){
    title = ar?'استمارة التكرار / المدة':'Frequency / Duration Tracking';
    const heads = ar?['التاريخ','الجلسة/الفترة','التكرار (عدّ)','العدد الكلي','مدة كل حدوث (ثانية)','ملاحظات']:['Date','Session/Interval','Tally','Total','Duration per occurrence (sec)','Notes'];
    body = hdr+`<table><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${('<tr>'+'<td>&nbsp;<br>&nbsp;</td>'.repeat(6)+'</tr>').repeat(14)}</table>`;
  } else {
    title = ar?'لوحة الاقتصاد الرمزي':'Token Economy Board';
    body = `<p>${ar?'اسم الطفل':'Child'}: ________________ &nbsp; ${ar?'السلوك المطلوب':'Target'}: ________________</p><p>${ar?'ألصق نجمة أو ارسم علامة عند كل نجاح:':'Place a star or tick for each success:'}</p>
      <div>${'<span class="star"></span>'.repeat(10)}</div><h3>${ar?'المعزّز عند اكتمال النجوم':'Reward when board is complete'}:</h3><div style="border:2px dashed #888;height:120px"></div>`;
  }
  return `<!DOCTYPE html><html lang="${lang}" dir="${dir}"><head><meta charset="utf-8"><title>${title}</title><style>${css}</style></head><body><h1>${title} — Mohamed Farag Abo Zaid | ABA Praxis</h1>${body}<p><button onclick="print()">${t('print')}</button></p></body></html>`;
}
function renderSheets(){
  const defs = [['abc','fa-table-list','sheet_abc','sheet_abc_d'],['freq','fa-chart-simple','sheet_freq','sheet_freq_d'],['token','fa-star','sheet_token','sheet_token_d']];
  $('#sheetGrid').innerHTML = defs.map(d=>`<div class="card bg-white rounded-2xl border border-brand-100 p-5">
    <i class="fa-solid ${d[1]} text-3xl text-brand-600"></i><h3 class="mt-3 font-bold text-brand-900">${t(d[2])}</h3><p class="text-sm text-slate-600 mt-1">${t(d[3])}</p>

function genBIP(){
  const fn = gv('fba:func','tangible'), ar = lang==='ar';
  const strat = {
    tangible:[ar?'إتاحة المعزّزات المفضلة بانتظام وبشكل غير مشروط.':'Provide preferred items on a regular, noncontingent basis.', ar?'تعليم الطلب المناسب (كلمة/إشارة/صورة) وتعزيزه فوراً.':'Teach an appropriate request (word/sign/picture) and reinforce immediately.', ar?'عدم تسليم المطلوب بعد السلوك المشكل.':'Do not deliver the item following the problem behavior.'],
    escape:[ar?'تقليل صعوبة المهمة أو تجزئتها ومزج مهام سهلة.':'Reduce task difficulty or chunk tasks and interleave easy items.', ar?'تعليم طلب استراحة أو مساعدة وتعزيزه فوراً.':'Teach requesting a break or help and reinforce immediately.', ar?'إكمال المهمة بتلقين ولطف دون إلغائها بعد السلوك المشكل.':'Calmly guide task completion with prompting; do not remove the task after the problem behavior.'],
    attention:[ar?'تقديم انتباه إيجابي منتظم قبل الحاجة إليه.':'Deliver regular positive attention before it is sought.', ar?'تعليم طلب الانتباه بطريقة مناسبة وتعزيزه.':'Teach an appropriate way to request attention and reinforce it.', ar?'تقليل الانتباه الموجّه للسلوك المشكل مع ضمان السلامة.':'Minimize attention to the problem behavior while ensuring safety.'],
    sensory:[ar?'إتاحة بدائل حسية مناسبة وأنشطة مُثرية.':'Provide appropriate sensory alternatives and enriched activities.', ar?'تعليم سلوك بديل يعطي مدخلاً حسياً مماثلاً.':'Teach a replacement behavior that provides similar sensory input.', ar?'تعديل البيئة لضمان السلامة وتقليل فرص السلوك.':'Modify the environment for safety and to reduce opportunities for the behavior.']
  }[fn];
  const fname = D(FUNCS.find(x=>x[0]===fn)[1]);
  const rows=[1,2,3].filter(i=>gv('fba:a'+i)||gv('fba:b'+i)||gv('fba:c'+i)).map(i=>`  ${i}) A: ${gv('fba:a'+i,'-')} | B: ${gv('fba:b'+i,'-')} | C: ${gv('fba:c'+i,'-')}`).join('\n') || '  -';
  const txt = ar
   ? `خطة التدخل السلوكي (BIP) — مسودة\n\nالسلوك المستهدف: ${gv('fba:target','-')}\nالتعريف الإجرائي: ${gv('fba:def','-')}\nالمكان/الأوقات: ${gv('fba:setting','-')}\n\nبيانات ABC:\n${rows}\n\nالوظيفة المرجّحة: ${fname}\nالسلوك البديل: ${gv('fba:repl','-')}\n\nاستراتيجيات الوقاية (قبل السلوك):\n- ${strat[0]}\n\nتعليم السلوك البديل:\n- ${strat[1]}\n\nاستراتيجية الاستجابة (بعد السلوك):\n- ${strat[2]}\n\nجمع البيانات: استمارة ABC + التكرار/المدة يومياً، ومراجعة أسبوعية.\nمعيار النجاح: ${gv('fba:goal','-')}\n\nملاحظة: مسودة تتطلب مراجعة محلل سلوك مؤهل وموافقة الأسرة.`
   : `Behavior Intervention Plan (BIP) — Draft\n\nTarget behavior: ${gv('fba:target','-')}\nOperational definition: ${gv('fba:def','-')}\nSettings/times: ${gv('fba:setting','-')}\n\nABC data:\n${rows}\n\nHypothesized function: ${fname}\nReplacement behavior: ${gv('fba:repl','-')}\n\nPrevention strategies (antecedent):\n- ${strat[0]}\n\nTeaching the replacement:\n- ${strat[1]}\n\nResponse strategy (consequence):\n- ${strat[2]}\n\nData collection: ABC sheet + frequency/duration daily, weekly review.\nSuccess criterion: ${gv('fba:goal','-')}\n\nNote: draft requiring review by a qualified behavior analyst and family consent.`;
  $('#bipOut').value = txt;
}

/* ----- calculators ----- */
const bg = (v,max) => `hsl(${Math.max(0,Math.min(1,v/max))*120} 60% 88%)`;
function calcVB(){
  const lv = [0,0,0];
  $$('[data-k^="vb:"][type="number"]').forEach(el=>{ const p = el.dataset.k.split(':'); if(/^[0-2]$/.test(p[1])){ const v=parseFloat(el.value)||0; lv[+p[1]] += v; el.style.background = bg(v,5);} });
  const max = VB_DOM.length*5, total = lv.reduce((a,b)=>a+b,0);
  let bar=0; VB_BAR.forEach((_,i)=>bar+=+gv('vb:bar:'+i,0));
  let tr=0; VB_TRN.forEach((_,i)=>tr+=+gv('vb:trn:'+i,1));
  let ee=0; [1,2,3,4,5].forEach(g=>ee+=+gv('vb:ee:'+g,0));
  $('#res-vb').innerHTML = `<b>${T('ملخص النتائج التجريبية','Trial results summary')}</b><ul class="mt-1 list-disc ms-5 space-y-1">
    ${VB_LVL.map((l,i)=>`<li>${D(l)}: <b>${lv[i]}</b> / ${max}</li>`).join('')}
    <li>${T('مجموع المعالم','Milestones total')}: <b>${total}</b> / ${max*3}</li>
    <li>${T('مجموع العوائق','Barriers total')}: <b>${bar}</b> / ${VB_BAR.length*4} ${bar>=48?'— '+T('عوائق مرتفعة تستحق التدخل','high barriers; target for intervention'):''}</li>
    <li>${T('مجموع الانتقال','Transition total')}: <b>${tr}</b> / ${VB_TRN.length*5}</li>
    <li>EESA: <b>${ee}</b> / 50</li></ul>`;
  drawChart('ch-vb','bar',VB_DOM.map(D),VB_LVL.map((l,i)=>({label:D(l),data:VB_DOM.map((_,d)=>+gv(`vb:${i}:${d}`,0)),backgroundColor:['#2a9d8f','#f4a261','#6366f1'][i]})),{scales:{y:{min:0,max:5}}});
}
function calcABLLS(){
  let sum=0;
  ABLLS.forEach((_,i)=>{ const v=+gv('ab:'+i,0); sum+=v; $('#ab-v-'+i).textContent=v+'%'; $('#ab-b-'+i).style.width=v+'%'; });
  const avg = Math.round(sum/ABLLS.length);
  const low = ABLLS.map((a,i)=>[a,+gv('ab:'+i,0)]).sort((x,y)=>x[1]-y[1]).slice(0,3).map(x=>x[0][0]+' '+D([x[0][1],x[0][2]])+' ('+x[1]+'%)').join('، ');
  $('#res-ablls').innerHTML = `<b>${T('المتوسط العام للمهارات المكتسبة','Overall average skills acquired')}: ${avg}%</b><p class="mt-1">${T('أضعف المجالات (أولوية للتدخل)','Weakest areas (intervention priority)')}: ${low}</p>`;
  drawChart('ch-ablls','radar',ABLLS.map(a=>a[0]),[{label:'%',data:ABLLS.map((_,i)=>+gv('ab:'+i,0)),backgroundColor:'rgba(42,157,143,.25)',borderColor:'#2a9d8f'}],{scales:{r:{min:0,max:100}}});
}
function calcDSM(){
  const A = [0,1,2].filter(i=>gv('dsm:a'+i,false)).length, B = [0,1,2,3].filter(i=>gv('dsm:b'+i,false)).length;
  const C = [0,1,2].every(i=>gv('dsm:c'+i,false));
  const met = A===3 && B>=2 && C, lvl = Math.max(+gv('dsm:lvA',1),+gv('dsm:lvB',1));
  $('#res-dsm').innerHTML = `<p>A: <b>${A}/3</b> · B: <b>${B}/4</b> · C–E: <b>${C?T('مستوفاة','met'):T('غير مكتملة','incomplete')}</b></p>
   <p class="mt-2 font-bold ${met?'text-orange-700':'text-slate-700'}">${met?T('النمط يتوافق مع معايير التوحد في الفرز المبدئي — يُنصح بإحالة لتقييم تشخيصي رسمي.','Pattern is consistent with ASD criteria on preliminary screening — referral for formal diagnostic evaluation is advised.'):T('النمط لا يستوفي معايير الفرز كاملة. إن استمر القلق فاطلب تقييماً متخصصاً.','Pattern does not meet the full screening criteria. If concerns persist, seek a specialist evaluation.')}</p>
   ${met?`<p class="mt-1">${T('مستوى الدعم المقترح (الأعلى بين المجالين)','Suggested support level (higher of the two domains)')}: <b>${lvl}</b></p>`:''}`;
}
function calcSpeech(){
  const sounds = lang==='ar' ? ART_AR : ART_EN;
  const errs = sounds.filter((_,i)=>gv(`sp:art:${lang}:${i}`,false));
  const acc = Math.round((1-errs.length/sounds.length)*100);
  const age = +gv('sp:age',0); let unmetR=0,unmetE=0,exp=0;
  LANG_BANDS.forEach((b,bi)=>{ if(age && b[0]<=age){ b[1].forEach((_,i)=>{exp++; if(!gv(`sp:r:${bi}:${i}`,false)) unmetR++;}); b[2].forEach((_,i)=>{exp++; if(!gv(`sp:e:${bi}:${i}`,false)) unmetE++;}); } });
  $('#res-speech').innerHTML = `<p>${T('دقة النطق في الفحص','Articulation screening accuracy')}: <b>${acc}%</b>${errs.length?` — ${T('أصوات بها خطأ','error sounds')}: <b>${errs.join(' ')}</b>`:''}</p>
   <p class="mt-1">${age?`${T('بنود لغوية غير محققة لعمر','Unmet language items up to age')} ${age} ${T('شهراً','months')}: ${T('استقبالية','receptive')} <b>${unmetR}</b>، ${T('تعبيرية','expressive')} <b>${unmetE}</b> ${T('من','of')} ${exp}`:T('أدخل عمر الطفل لمقارنة اللغة.','Enter the child\'s age to compare language.')}</p>
   <p class="mt-1 font-semibold">${(unmetR+unmetE)>=3||errs.length>=6?T('مؤشرات تستدعي تقييماً متخصصاً في النطق واللغة.','Indicators that warrant a specialist speech-language evaluation.'):T('لا مؤشرات قوية في هذا الفرز المبدئي.','No strong indicators in this preliminary screen.')}</p>`;
}
function calcSSI(){
  const syl=+gv('ssi:syl',0), st=+gv('ssi:st',0), pct = syl? st/syl*100 : 0;
  const fS = pct<1?1:pct<2?2:pct<3?3:pct<5?4:pct<7?5:pct<10?6:pct<15?7:pct<20?8:9;
  const ds=[gv('ssi:d1',0),gv('ssi:d2',0),gv('ssi:d3',0)].map(Number), avg=(ds[0]+ds[1]+ds[2])/3;
  const dS = avg<0.5?1:avg<1?2:avg<2?3:avg<5?4:avg<10?5:avg<30?6:avg<60?7:8;
  let cS=0; for(let i=0;i<4;i++) cS+=+gv('ssi:c'+i,0);
  const tot=fS+dS+cS;
  const sev = tot<=8?T('خفيف جداً','Very mild'):tot<=14?T('خفيف','Mild'):tot<=20?T('متوسط','Moderate'):tot<=27?T('شديد','Severe'):T('شديد جداً','Very severe');
  $('#res-ssi').innerHTML = `<ul class="list-disc ms-5 space-y-1"><li>${T('نسبة المقاطع المتلعثمة','% syllables stuttered')}: <b>${pct.toFixed(1)}%</b> → ${T('درجة التكرار','frequency score')} <b>${fS}</b></li>
   <li>${T('متوسط أطول 3 لحظات','Mean of 3 longest events')}: <b>${avg.toFixed(1)} s</b> → ${T('درجة المدة','duration score')} <b>${dS}</b></li><li>${T('الحركات المصاحبة','Physical concomitants')}: <b>${cS}</b> / 20</li></ul>
   <p class="mt-2 font-bold">${T('المجموع','Total')}: ${tot} — ${T('الشدة التقديرية','Estimated severity')}: ${sev}</p>`;
}

}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* =====================================================================
   8) ADMIN DASHBOARD (no server, free)
   - Open with the gear icon in the footer or with the address ending in #admin
   - Edits are saved as a draft in THIS browser and shown live.
   - "Export content.json" → put that file next to index.html when you publish
     and every visitor sees your changes.
   ===================================================================== */
(function(){
  const LS = 'abaDraft', PWK = 'abaAdminPw';
  const arrs = { courses, articles, gallery, services, categories };
  const CFG_KEYS = ['email','whatsappNumber','prices','bank','wallets','social','sections','adminHash'];
  CONFIG.sections = CONFIG.sections || {};
  const GHD = { owner:'abaabozaid-coder', repo:'aba-apraxis-m-abozaid', branch:'main' };
  const gh = () => { try { return Object.assign({}, GHD, JSON.parse(lsGet('abaGh') || '{}')); } catch(e){ return Object.assign({}, GHD); } };
  const SECTIONS = [['courses','الدورات','Courses'],['articles','المقالات','Articles'],['toolkit','الأدوات والمعرض','Toolkit & gallery'],['assessment','ركن التقييم','Assessment suite'],['services','الخدمات المدفوعة','Paid services'],['contact','التواصل','Contact']];
  const TXT_KEYS = ['hero_kicker','hero_title','hero_role','hero_desc','hero_cta1','hero_cta2','hero_cta3','pill1','pill2','pill3','pill4','courses_h','courses_sub','articles_h','articles_sub','toolkit_h','toolkit_sub','assess_h','assess_sub','assess_disclaimer','services_h','services_sub','contact_h','contact_sub','footer'];
  const clone = o => JSON.parse(JSON.stringify(o));
  const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
  const lsSet = (k,v) => { try { localStorage.setItem(k,v); return true; } catch(e){ return false; } };

  function snapshot(){
    const c = { config:{}, i18n:{ar:{},en:{}} };
    CFG_KEYS.forEach(k => c.config[k] = CONFIG[k]);
    for (const k in arrs) c[k] = arrs[k];
    TXT_KEYS.forEach(k => { c.i18n.ar[k] = i18n.ar[k]; c.i18n.en[k] = i18n.en[k]; });
    return clone(c);
  }
  const DEFAULTS = snapshot();
  function apply(c){
    if (!c || typeof c !== 'object') return;
    for (const k in arrs) if (Array.isArray(c[k])) { arrs[k].length = 0; arrs[k].push(...c[k]); }
    if (c.config) CFG_KEYS.forEach(k => { if (c.config[k] !== undefined) CONFIG[k] = c.config[k]; });
    if (c.i18n) ['ar','en'].forEach(l => Object.assign(i18n[l], c.i18n[l] || {}));
  }
  let saveTimer;
  function save(){ lsSet(LS, JSON.stringify(snapshot())); clearTimeout(saveTimer); saveTimer = setTimeout(applyLang, 350); }

  async function sha(s){
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('aba|'+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
    catch(e){ let h=5381; for (const ch of 'aba|'+s) h=((h<<5)+h+ch.charCodeAt(0))|0; return 'x'+h; }
  }
  async function unlock(){
    if (CONFIG.adminHash){   // panel is locked to the owner's passcode in every browser
      const q = prompt(T('كلمة مرور لوحة التحكم:','Admin passcode:'));
      return !!q && (await sha(q)) === CONFIG.adminHash;
    }
    const stored = lsGet(PWK);
    if (!stored){
      const p = prompt(T('أنشئ كلمة مرور للوحة التحكم (6 أحرف على الأقل). تُحفظ في هذا المتصفح فقط:','Create an admin passcode (min 6 chars). Stored in this browser only:'));
      if (!p || p.length < 6) return false;
      lsSet(PWK, await sha(p)); return true;
    }
    const p = prompt(T('كلمة مرور لوحة التحكم:','Admin passcode:'));
    return !!p && (await sha(p)) === stored;
  }

  /* ---------- field specs ---------- */
  const catOpts = () => categories.filter(c => c.key !== 'all');
  const SPEC = {
    categories: [['key','Key (latin letters, no spaces)'],['ar','الاسم (عربي)'],['en','Name (English)']],
    courses:  [['title_ar','العنوان (عربي)'],['title_en','Title (English)'],['desc_ar','الوصف (عربي)','area'],['desc_en','Description (English)','area'],['youtubeId','YouTube video ID'],['pdf','PDF link / path']],
    articles: [['cat','Category','cat'],['date','Date'],['title_ar','العنوان (عربي)'],['title_en','Title (English)'],['desc_ar','وصف مختصر (عربي)'],['desc_en','Short description (English)'],['body_ar','نص المقال (عربي)','area6'],['body_en','Article body (English)','area6']],
    gallery:  [['title_ar','العنوان (عربي)'],['title_en','Title (English)'],['src','Image URL / path (or choose a small file)','img'],['icon','Icon (Font Awesome, e.g. fa-star)']],
    services: [['title_ar','العنوان (عربي)'],['title_en','Title (English)'],['desc_ar','الوصف (عربي)','area'],['desc_en','Description (English)','area'],['icon','Icon (Font Awesome)']]
  };
  const NEW = {
    categories: () => ({ key:'cat'+Date.now(), ar:'تصنيف جديد', en:'New category' }),
    courses: () => ({ id:Date.now(), youtubeId:'', pdf:'', title_ar:'دورة جديدة', desc_ar:'', title_en:'New course', desc_en:'' }),
    articles: () => ({ id:Date.now(), cat:'basics', date:new Date().toISOString().slice(0,10), title_ar:'مقال جديد', desc_ar:'', body_ar:'', title_en:'New article', desc_en:'', body_en:'' }),
    gallery: () => ({ id:Date.now(), src:'', icon:'fa-image', title_ar:'عنصر جديد', title_en:'New item' }),
    services: () => ({ id:'svc'+Date.now(), icon:'fa-briefcase', title_ar:'خدمة جديدة', title_en:'New service', desc_ar:'', desc_en:'' })
  };

  /* ---------- show / hide sections ---------- */
  function applySections(){
    SECTIONS.forEach(s => {
      const hide = CONFIG.sections[s[0]] === false;
      const sec = document.getElementById(s[0]); if (sec) sec.classList.toggle('hidden', hide);
      $$('a[href="#'+s[0]+'"]').forEach(a => a.classList.toggle('hidden', hide));
    });
  }
  const _origApply = applyLang;
  applyLang = function(){ _origApply(); applySections(); };

  /* ---------- one-click publish to GitHub (content.json) ---------- */
  async function publish(){
    const g = gh(), msg = ov && ov.querySelector('#adGhMsg');
    const say = (t, ok) => { if (msg){ msg.textContent = t; msg.className = 'text-sm ' + (ok ? 'text-green-700' : 'text-red-600'); } };
    if (!g.token){ say(T('أدخل الـ Token أولاً (تبويب «البيانات والنشر»).','Enter your token first (Data & publish tab).'), false); tab = 'data'; render(); return; }
    const api = `https://api.github.com/repos/${g.owner}/${g.repo}/contents/content.json`;
    const hdr = { Authorization:'Bearer '+g.token, Accept:'application/vnd.github+json' };
    say(T('جارٍ النشر...','Publishing...'), true);
    try {
      let sha; const r = await fetch(api + '?ref=' + encodeURIComponent(g.branch), { headers:hdr });
      if (r.ok) sha = (await r.json()).sha; else if (r.status !== 404) throw new Error('GitHub ' + r.status);
      const body = { message:'Update content from admin panel', branch:g.branch, content: btoa(unescape(encodeURIComponent(JSON.stringify(snapshot(), null, 2)))) };
      if (sha) body.sha = sha;
      const p = await fetch(api, { method:'PUT', headers:Object.assign({'Content-Type':'application/json'}, hdr), body:JSON.stringify(body) });
      if (!p.ok) throw new Error('GitHub ' + p.status + ' ' + ((await p.json().catch(()=>({}))).message || ''));
      say(T('تم النشر. تظهر التعديلات للزوار خلال دقيقة أو دقيقتين.','Published. Visitors will see the changes in a minute or two.'), true);
    } catch(err){ say(T('فشل النشر: ','Publish failed: ') + err.message, false); }
  }

  /* ---------- UI ---------- */
  let tab = 'overview', ov;
  const inp = 'class="inp"';
  const attr = esc;
  const val = (o,p) => p.split('.').reduce((a,k)=>a==null?'':a[k], o);
  const field = (label, path, extra='') => `<label class="text-xs block">${label}<input ${inp} data-path="${attr(path)}" value="${attr(val(CONFIG,path)??'')}" ${extra}></label>`;

  function tabSettings(){
    let h = `<div class="grid sm:grid-cols-2 gap-3">${field(T('رقم واتساب (دولي بدون +)','WhatsApp number (intl, no +)'),'whatsappNumber','dir="ltr"')}${field(T('بريد استقبال الحجوزات والرسائل','Email that receives bookings/messages'),'email','dir="ltr"')}</div>`;
    h += `<h4 class="font-bold mt-5">${T('بيانات التحويل البنكي','Bank transfer details')}</h4><div class="grid sm:grid-cols-2 gap-3 mt-2">${['holder','bankName','iban','account','swift'].map(k=>field(k,'bank.'+k,'dir="auto"')).join('')}</div>`;
    h += `<h4 class="font-bold mt-5">${T('المحافظ الإلكترونية','E-wallets')}</h4><div class="grid gap-2 mt-2">${CONFIG.wallets.map((w,i)=>`<div class="grid grid-cols-2 gap-2">${field(T('الاسم','Name'),`wallets.${i}.name`)}${field(T('الرقم','Number'),`wallets.${i}.number`,'dir="ltr"')}</div>`).join('')}</div><button data-addwallet class="btn btn-o !py-1 mt-2 text-sm">+ ${T('محفظة','Wallet')}</button>`;
    h += `<h4 class="font-bold mt-5">${T('روابط التواصل الاجتماعي','Social links')}</h4><div class="grid sm:grid-cols-2 gap-3 mt-2">${Object.keys(CONFIG.social).map(k=>field(k,'social.'+k,'dir="ltr" placeholder="https://..."')).join('')}</div>`;
    h += `<h4 class="font-bold mt-5">${T('أسعار الخدمات (اتركها فارغة = تواصل لمعرفة السعر)','Service prices (empty = contact for price)')}</h4><div class="overflow-x-auto"><table class="tbl mt-2 w-full"><tr><th></th><th>SAR</th><th>EGP</th><th>USD</th></tr>${services.map(s=>`<tr><td class="text-start">${attr(s['title_'+lang])}</td>${['SAR','EGP','USD'].map(c=>`<td><input type="number" min="0" data-path="prices.${attr(s.id)}.${c}" value="${attr(val(CONFIG,`prices.${s.id}.${c}`)??'')}" class="inp !w-24"></td>`).join('')}</tr>`).join('')}</table></div>`;
    return h;
  }
  function tabList(name){
    const items = arrs[name], spec = SPEC[name];
    let h = `<button data-add="${name}" class="btn btn-p mb-3">+ ${T('إضافة','Add')}</button><div class="grid gap-3">`;
    items.forEach((it,i)=>{
      h += `<details class="border rounded-xl bg-white"><summary class="cursor-pointer p-3 font-semibold flex justify-between gap-2"><span>${i+1}. ${attr(it['title_'+lang]||it.title_en||it.title_ar||it[lang]||it.key||'')}</span></summary><div class="p-3 grid gap-3 border-t">
        ${spec.map(f => {
          const k=f[0], label=f[1], type=f[2], v=attr(it[k]??'');
          if (type==='area'||type==='area6') return `<label class="text-xs">${label}<textarea ${inp} rows="${type==='area6'?7:3}" data-col="${name}" data-idx="${i}" data-f="${k}">${v}</textarea></label>`;
          if (type==='cat') return `<label class="text-xs">${label}<select ${inp} data-col="${name}" data-idx="${i}" data-f="${k}">${catOpts().map(c=>`<option value="${c.key}" ${c.key===it[k]?'selected':''}>${c[lang]}</option>`).join('')}</select></label>`;
          if (type==='img') return `<label class="text-xs">${label}<input ${inp} data-col="${name}" data-idx="${i}" data-f="${k}" value="${it[k] && it[k].startsWith('data:') ? '' : v}" placeholder="${it[k] && it[k].startsWith('data:') ? '(embedded image)' : ''}"><input type="file" accept="image/*" data-colimg="${name}" data-idx="${i}" class="mt-1 text-xs"></label>`;
          return `<label class="text-xs">${label}<input ${inp} data-col="${name}" data-idx="${i}" data-f="${k}" value="${v}"></label>`;
        }).join('')}
        <div class="flex gap-2 flex-wrap"><button data-mv="${name}:${i}:-1" class="btn btn-o !py-1 text-sm">↑</button><button data-mv="${name}:${i}:1" class="btn btn-o !py-1 text-sm">↓</button>${it.key==='all' ? '' : `<button data-del="${name}:${i}" class="btn !py-1 text-sm bg-red-600 text-white">${T('حذف','Delete')}</button>`}</div></div></details>`;
    });
    return h + '</div>';
  }
  function tabOverview(){
    const g = gh(), prices = Object.values(CONFIG.prices||{}).some(p => Object.values(p||{}).some(v => v));
    const todo = [
      [!CONFIG.bank.iban && !CONFIG.bank.account, T('أضف بيانات التحويل البنكي','Add bank transfer details'), 'settings'],
      [!(CONFIG.wallets||[]).some(w => w.number), T('أضف أرقام المحافظ الإلكترونية','Add e-wallet numbers'), 'settings'],

      [!Object.values(CONFIG.social||{}).some(Boolean), T('أضف روابط التواصل الاجتماعي','Add social links'), 'settings'],
      [courses.some(c => !c.youtubeId), T('أضف معرّفات فيديو يوتيوب للدورات ('+courses.filter(c=>!c.youtubeId).length+')','Add YouTube IDs to courses ('+courses.filter(c=>!c.youtubeId).length+')'), 'courses'],
      [!g.token, T('اضبط النشر المباشر على GitHub','Set up direct GitHub publishing'), 'data']
    ];
    const cards = [[T('الدورات','Courses'),courses.length],[T('المقالات','Articles'),articles.length],[T('المعرض','Gallery'),gallery.length],[T('الخدمات','Services'),services.length],[T('التصنيفات','Categories'),categories.length-1]];
    return `<div class="grid grid-cols-2 sm:grid-cols-5 gap-3">${cards.map(c=>`<div class="p-3 rounded-xl bg-white border text-center"><div class="text-2xl font-extrabold text-brand-700">${c[1]}</div><div class="text-xs text-slate-600">${c[0]}</div></div>`).join('')}</div>
      <h4 class="font-bold mt-6">${T('قائمة ما ينقص','To-do checklist')}</h4>
      <div class="grid gap-2 mt-2">${todo.map(x=>`<button data-atab="${x[2]}" class="text-start p-3 rounded-xl border ${x[0]?'bg-orange-50 border-orange-200':'bg-green-50 border-green-200'}">${x[0]?'⚠':'✔'} ${x[1]}</button>`).join('')}</div>
      <div class="mt-6 flex flex-wrap gap-2"><button id="adPublish2" class="btn btn-g"><i class="fa-brands fa-github me-1"></i>${T('نشر التعديلات الآن','Publish changes now')}</button></div><p id="adGhMsg" class="text-sm mt-2"></p>`;
  }
  function tabSections(){
    return `<p class="text-sm text-slate-600 mb-3">${T('أخفِ أو أظهر أقسام الموقع. القسم المخفي يختفي هو ورابطه من القائمة.','Show or hide site sections. A hidden section disappears along with its menu link.')}</p><div class="grid gap-2">${SECTIONS.map(s=>`<label class="flex items-center gap-3 p-3 rounded-xl border bg-white"><input type="checkbox" data-sec="${s[0]}" ${CONFIG.sections[s[0]]!==false?'checked':''}><span>${lang==='ar'?s[1]:s[2]}</span></label>`).join('')}</div>`;
  }
  function tabTexts(){
    return `<p class="text-sm text-slate-600 mb-3">${T('عدّل نصوص الصفحة الرئيسية والعناوين بالعربية والإنجليزية.','Edit homepage texts and headings in Arabic and English.')}</p><div class="grid gap-3">${TXT_KEYS.map(k=>`<div class="grid sm:grid-cols-2 gap-2 border-b pb-3"><label class="text-xs">${k} · AR<textarea ${inp} rows="2" data-tx="ar:${k}">${attr(i18n.ar[k]||'')}</textarea></label><label class="text-xs">${k} · EN<textarea ${inp} rows="2" data-tx="en:${k}">${attr(i18n.en[k]||'')}</textarea></label></div>`).join('')}</div>`;
  }
  function tabData(){
    return `<div class="grid gap-4 max-w-xl"><div class="note">${T('التعديلات تُحفظ كمسودة في هذا المتصفح وتظهر لك مباشرة. لتظهر لكل الزوار: صدّر ملف content.json وضعه بجانب index.html ثم أعد رفع المجلد.','Edits are saved as a draft in this browser and shown live. To show them to all visitors: export content.json, put it next to index.html, and re-upload the folder.')}</div>
      <div class="p-4 rounded-xl border bg-white grid gap-2"><b>${T('النشر المباشر على GitHub (بدون رفع يدوي)','Direct publish to GitHub (no manual upload)')}</b>
        <div class="grid grid-cols-3 gap-2">${['owner','repo','branch'].map(k=>`<label class="text-xs">${k}<input ${inp} data-gh="${k}" value="${attr(gh()[k]||'')}" dir="ltr"></label>`).join('')}</div>
        <label class="text-xs">Token<input type="password" ${inp} data-gh="token" value="${attr(gh().token||'')}" dir="ltr" autocomplete="off"></label>
        <p class="text-xs text-slate-600">${T('أنشئ Token محدود: GitHub ← Settings ← Developer settings ← Personal access tokens ← Fine-grained tokens ← Generate. اختر هذا المستودع فقط، وصلاحية Contents: Read and write. يُحفظ في هذا المتصفح فقط؛ احذفه إن كان الجهاز مشتركاً.','Create a limited token: GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate. Select this repository only, with Contents: Read and write. Stored in this browser only; delete it on a shared computer.')}</p>
        <div><button id="adPublish2" class="btn btn-g"><i class="fa-brands fa-github me-1"></i>${T('نشر الآن','Publish now')}</button></div><p id="adGhMsg" class="text-sm"></p></div>
      <button id="adExport" class="btn btn-p"><i class="fa-solid fa-download me-1"></i>${T('تصدير content.json','Export content.json')}</button>
      <label class="text-sm">${T('استيراد ملف content.json','Import a content.json file')}<input id="adImport" type="file" accept="application/json" class="block mt-1"></label>
      <div class="p-4 rounded-xl border bg-white grid gap-2"><b>${T('قفل اللوحة بكلمة مرورك في كل المتصفحات','Lock the panel to your passcode in every browser')}</b>
        <p class="text-xs text-slate-600">${T('بعد القفل لا يستطيع أحد فتح اللوحة دون كلمة مرورك، ولو عرف طريقة فتحها. اضغط القفل ثم «نشر».','After locking, nobody can open the panel without your passcode, even if they know how to open it. Press Lock, then Publish.')}</p>
        <div><button id="adLock" class="btn btn-o"><i class="fa-solid fa-lock me-1"></i>${T('قفل بكلمة مروري الحالية','Lock with my current passcode')}</button></div></div>

      <button id="adPw" class="btn btn-o">${T('تغيير كلمة المرور','Change passcode')}</button></div>`;
  }

  function render(){
    const tabsA = [['overview',T('نظرة عامة','Overview')],['settings',T('الإعدادات والدفع','Settings & payments')],['courses',T('الدورات','Courses')],['articles',T('المقالات','Articles')],['categories',T('التصنيفات','Categories')],['gallery',T('المعرض','Gallery')],['services',T('الخدمات','Services')],['sections',T('الأقسام','Sections')],['texts',T('النصوص','Texts')],['data',T('البيانات والنشر','Data & publish')]];
    const body = tab==='overview' ? tabOverview() : tab==='settings' ? tabSettings() : tab==='sections' ? tabSections() : tab==='texts' ? tabTexts() : tab==='data' ? tabData() : tabList(tab);
    ov.innerHTML = `<div class="max-w-4xl mx-auto bg-white min-h-full p-4 sm:p-6"><div class="flex items-center justify-between gap-2"><h2 class="text-xl font-extrabold text-brand-900"><i class="fa-solid fa-gear me-2"></i>${T('لوحة التحكم','Admin dashboard')}</h2><div class="flex gap-2"><button id="adPublish" class="btn btn-g !py-1"><i class="fa-brands fa-github me-1"></i>${T('نشر','Publish')}</button><button id="adClose" class="btn btn-o !py-1">${T('إغلاق','Close')} ✕</button></div></div>
      <div class="flex flex-wrap gap-2 mt-4">${tabsA.map(x=>`<button data-atab="${x[0]}" class="px-3 py-1.5 rounded-full border text-sm font-bold ${x[0]===tab?'tab-on':'bg-white text-slate-600 border-slate-300'}">${x[1]}</button>`).join('')}</div>
      <div class="mt-5" id="adBody">${body}</div></div>`;
  }
  const keepOpen = () => [...ov.querySelectorAll('details')].map(d=>d.open);

  function setPath(path, value){
    const parts = path.split('.'); let o = CONFIG;
    for (let i=0;i<parts.length-1;i++){ if (o[parts[i]]==null || typeof o[parts[i]]!=='object') o[parts[i]] = {}; o = o[parts[i]]; }
    const last = parts[parts.length-1];
    o[last] = (parts[0]==='prices') ? (value===''?null:Number(value)) : value;
  }
  function open(){
    if (!ov){
      ov = document.createElement('div'); ov.id = 'adminOverlay';
      ov.className = 'hidden fixed inset-0 z-[60] overflow-y-auto bg-slate-100';
      document.body.appendChild(ov);
      ov.addEventListener('input', e => {
        const el = e.target;
        if (el.dataset.gh){ const g = JSON.parse(lsGet('abaGh') || '{}'); g[el.dataset.gh] = el.value.trim(); lsSet('abaGh', JSON.stringify(g)); return; }
        if (el.dataset.path) setPath(el.dataset.path, el.value);
        else if (el.dataset.col && el.dataset.f) arrs[el.dataset.col][+el.dataset.idx][el.dataset.f] = el.value;
        else if (el.dataset.tx){ const [l,k] = el.dataset.tx.split(':'); i18n[l][k] = el.value; }
        else return;
        save();
      });
      ov.addEventListener('change', e => {
        const el = e.target;
        if (el.dataset.sec){ CONFIG.sections[el.dataset.sec] = el.checked; save(); return; }
        if (el.dataset.colimg){
          const f = el.files[0]; if (!f) return;
          if (f.size > 400*1024) return alert(T('الصورة كبيرة (الحد 400KB). استخدم رابطاً أو صورة أصغر.','Image too large (max 400KB). Use a URL or a smaller image.'));
          const r = new FileReader(); r.onload = () => { arrs[el.dataset.colimg][+el.dataset.idx].src = r.result; save(); render(); }; r.readAsDataURL(f);
        } else if (el.id === 'adImport'){
          const f = el.files[0]; if (!f) return;
          const r = new FileReader(); r.onload = () => { try { apply(JSON.parse(r.result)); save(); render(); alert('OK'); } catch(err){ alert('Invalid file'); } }; r.readAsText(f);
        }
      });
      ov.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.id==='adClose'){ ov.classList.add('hidden'); document.body.style.overflow=''; if (location.hash==='#admin') history.replaceState(null,'',location.pathname+location.search); return; }
        if (b.dataset.atab){ tab = b.dataset.atab; render(); return; }
        if (b.dataset.add){ arrs[b.dataset.add].push(NEW[b.dataset.add]()); save(); render(); return; }
        if (b.dataset.addwallet!==undefined){ CONFIG.wallets.push({name:'',number:''}); save(); render(); return; }
        if (b.dataset.del){ const [n,i] = b.dataset.del.split(':'); if (confirm(T('حذف هذا العنصر؟','Delete this item?'))){ arrs[n].splice(+i,1); save(); render(); } return; }
        if (b.dataset.mv){ const [n,i,d] = b.dataset.mv.split(':'); const a = arrs[n], from=+i, to=from+(+d); if (to>=0 && to<a.length){ [a[from],a[to]] = [a[to],a[from]]; save(); render(); } return; }
        if (b.id==='adLock'){ const h = lsGet(PWK); if (!h) return alert('Set a passcode first'); CONFIG.adminHash = h; save(); alert(T('تم القفل. اضغط «نشر» ليسري على كل الزوار.','Locked. Press Publish so it applies to all visitors.')); return; }
        if (b.id==='adPublish' || b.id==='adPublish2'){ publish(); return; }
        if (b.id==='adExport'){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'})); a.download='content.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); return; }
        if (b.id==='adReset'){ if (confirm(T('مسح المسودة؟','Discard the draft?'))){ try{localStorage.removeItem(LS);}catch(e){} location.reload(); } return; }
        if (b.id==='adPw'){ (async()=>{ const p = prompt(T('كلمة المرور الجديدة (6 أحرف على الأقل):','New passcode (min 6 chars):')); if (p && p.length>=6){ lsSet(PWK, await sha(p)); alert('OK'); } })(); return; }
      });
    }
    render(); ov.classList.remove('hidden'); document.body.style.overflow = 'hidden';
  }
  async function tryOpen(){ if (await unlock()) open(); else if (location.hash==='#admin') history.replaceState(null,'',location.pathname+location.search); }
  // secret entry: 5 quick taps on the © sign, Ctrl+Alt+A, or the address ending in #admin
  let taps = 0, tapTimer;
  $('#adminOpen').addEventListener('click', () => { taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 2500); if (taps >= 5){ taps = 0; tryOpen(); } });
  document.addEventListener('keydown', e => { if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'a') tryOpen(); });
  window.addEventListener('hashchange', () => { if (location.hash==='#admin') tryOpen(); });

  // ---- start-up: published content.json, then this browser's draft, then render ----
  (async function init(){
    try { const r = await fetch('content.json', {cache:'no-store'}); if (r.ok) apply(await r.json()); } catch(e){}
    const d = lsGet(LS); if (d) { try { apply(JSON.parse(d)); } catch(e){} }
    applyLang();
    if (location.hash === '#admin') tryOpen();
  })();
})();
</script>
